<style>
:root{--main:#2B6CCD;--hl:#FEE640;--ink:#31364B;--note:#C6D0D6;--bg:#161C20}

a i{font-style:normal;font-weight:700;color:var(--main);white-space:nowrap}
footer{margin-top:36px;font-size:14px;line-height:1.8;color:var(--note)}
