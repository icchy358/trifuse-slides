    for (let i = 0; i < 3; i++) { const x = zx((LAND ? .56 : .52) + i * (LAND ? .13 : .16)), iy = y - s * 2.3; pawn(x, y, s, ['#7f9ccc', '#9bb89a', '#c4a6c9'][i]);

/* ───────── 送り ───────── */
/* 表どうしの長さと名前を、開いたときに確かめる（ずれていたら 絵の失敗 として記録に出す） */
if (KS.length !== B.length || CAMS.length !== B.length || BZL.length !== B.length || TINT.length !== B.length) note('表の長さ: 場面の数');
B.forEach((b, i) => { if ((KS[i] || []).length !== b.steps.length || (CAMS[i] || []).length !== b.steps.length) note('表の長さ: 場面' + (i + 1));
  b.steps.forEach((s, j) => { if (!FACE[s.f] || !POSE[s.o] || (s.l || []).some(k => !L[k]) || Object.keys(s.p || {}).some(k => !(k in DEF))) note('表の名前: 場面' + (i + 1) + '-' + (j + 1)); }); });

/* ───────── 節ごとの移動（下の点と目次） ───────── */
const SECS = []; B.forEach((b, i) => { if (!SECS.length || SECS[SECS.length - 1].ch !== b.ch) SECS.push({ch: b.ch, ttl: b.ttl, first: i, last: i}); else SECS[SECS.length - 1].last = i; });

function buildNav() {
  $('#dots').innerHTML = SECS.map((x, i) => '<button data-s="' + i + '" title="' + esc(tocName(x)) + '" aria-label="' + esc(tocName(x)) + '">' + esc(dotLabel(x)) + '</button>').join('');

function go(n, instant, s) { bi = clamp(n | 0, 0, B.length - 1); st = clamp((s || 0) | 0, 0, B[bi].steps.length - 1); show(instant); }
function next() { if (st < B[bi].steps.length - 1) { st++; show(false); } else if (bi < B.length - 1) { bi++; st = 0; show(false); } }

  safe('ふるい', () => sieve(t)); safe('砂時計', () => hourglass(t)); safe('学び', tokens); safe('約束', twin); safe('大きな相手', bigp); safe('急かし', () => hurry(t)); safe('紹介', friend); safe('煙', () => smoke(t));
  safe('話', msg); safe('題材', ads); safe('紙', paper); safe('印', stamps); safe('ノート', () => sheet(t)); REC = false; safe('ペンギン', () => person(t)); safe('シロクマ', () => bear(t)); safe('手前', fore);

let FIT = 1, FX = 0, FY = 0, VW0 = 0, VH0 = 0;   /* pcfit v1.0: スマホの横向きで縮める倍率と、真ん中に置くためのずらし（1・0 は縮めない） */
