  {f: 'read', o: 'look', p: {qtg: 1, qpr: 1, qwb: 1}, pl: {qtm: 1}, b: ['m', '値段は、毎日動くんだ'], t: `債券も株式と同じように市場で売り買いできるので、日々の値段は動きます。しかし、発行体が投資家に約束しているのは、決まった利息を払うことと満期に元本を返すことだけで、途中の市場の値段がどうなるかは何も保証していません。`},
  {f: 'hm', o: 'hold', p: {qtg: 1, qtm: 1, qyr: 3}, tm: '3年目に売る', b: ['m', '3年目に、急にお金が要る'], t: `カフェの例で言えば、5年後に100万円が戻ってくる債券を持っていても、3年目に急な出費があり、ほかの人に買い取ってもらう場合を考えます。`},
  {f: 'search', o: 'lean', p: {qtg: 1, qup: 1, qpr: 1}, pl: {qtm: 1, qyr: 3}, tml: '3年目に売る', b: ['q', '「年3%の債券」'], t: `そのとき世の中の金利が上がっていて、ほかの店が「年4%の利息」でお金を集めていたとすれば、あなたの「年3%の債券」を100万円で買ってくれる人はいません。`},
  {f: 'sober', o: 'hold', p: {qtg: 1, qup: 1, qpr: 1, qdn: 1}, pl: {qtm: 1, qyr: 3}, tml: '3年目に売る', b: ['q', '「97万円に値引きしてくれるなら」'], t: `「97万円に値引きしてくれるなら引き受ける」と言われ、市場では元本より安い値段でしか売れなくなります。`},
  {f: 'nod', o: 'rest', p: {qtg: 1, qpr: 1, qsame: 1}, pl: {qtm: 1, qyr: 3}, tml: '3年目に売る', b: ['m', '金利が同じなら、ほぼ100万円'], t: `反対に、世の中の金利が年3%のまま変わっていなければ、3年目でもほぼ100万円で買い手が見つかります（説明のための例。実際の値段は日々動きます）。`},
  {f: 'sure', o: 'chest', p: {qtm: 1, qyr: 5, qce: 1}, tm: '満期まで持つ', b: ['m', '持ち続ければ、100万円'], t: `途中でほかの人に売れば元本より安くしか売れない場合もありますが、満期まで持っていれば、カフェから約束どおり額面の100万円が返ってきます。額面は満期に戻ってくると約束された金額です。`},
  {f: 'resolve', o: 'point', p: {qce: 1}, pl: {qtm: 1}, b: ['q', '「契約どおりの利息と満期の元本を返すこと」'], t: `市場で売り買いされる値段に目を奪われると、商品の性質を見誤ります。発行体が負っている法律上の義務は「契約どおりの利息と満期の元本を返すこと」までで、途中で値段が上がることを約束しているわけではありません。この線引きをはっきり分けて押さえます。`},
 ]},
 {ch: '3節', ttl: '3. 返す義務と信用力', sd: 1, steps: [
  {f: 'curious', o: 'look', p: {qab: 1, qar: .5, qbr: .5}, b: ['m', '義務があっても、戻らない？'], t: `答え：返す義務があっても、借りた側が破綻すればお金は戻らないので、約束どおり払える確からしさ（信用力）を見る必要があります。`},
  {f: 'hm', o: 'chin', p: {qab: 1, qar: .5, qbr: .5}, b: ['q', '「分けて考える必要があります」'], t: `発行体に法律上の返す義務があることと、そのお金が必ず手元に戻ってくることは、分けて考える必要があります。`},
  {f: 'serious', o: 'hold', p: {qab: 1, qar: .5, qbr: .5}, b: ['q', '「信用力」'], t: `法律上の義務がどれほど厳しくても、借りた側が破綻して、払うための資産をすべて失えば、利息や元本は戻りません。債券の発行体が約束どおりに利息と元本を払える確からしさの度合いを、金融の実務では「信用力」と呼びます。`},
  {f: 'friendly', o: 'hold', p: {qab: 1, qar: .9, qbr: .5, qhA: 1, qr1: 1}, b: ['m', 'Aさんなら、安心'], t: `個人の貸し借りにたとえると、毎月安定した給料があり貯金も多い公務員の友人Aさんに100万円を貸す場合、返せなくなる心配はほとんどありません（信用力がとても高い状態）。Aさんなら、年1%（年1万円）の利息でも貸す人はすぐに見つかります（説明のための例）。`},
  {f: 'uneasy', o: 'chin', p: {qab: 1, qar: .9, qbr: .1, qhB: 1, qr1: 1}, b: ['m', 'Bさんは、心配だ'], t: `一方、決まった仕事がなく、すでにいくつも借金を抱えている知人Bさんに100万円を貸す場合、借用書にどれほど立派な文が並んでいても、Bさんが無一文になればお金は戻りません（信用力が低い状態）。`},
  {f: 'know', o: 'chest', p: {qab: 1, qar: .9, qbr: .1, qr1: 1}, b: ['q', '「利回り」'], t: `信用力に不安がある相手ほど、お金を貸す側は多くの見返りを求めます。この貸し借りで払われる見返りの割合が金利で、投資した元本に対して1年で得られる収益の割合を利回りと呼びます。`},
 ]},
 {ch: '4節', ttl: '4. 高い利回りが生まれる理由', sd: 1, steps: [
  {f: 'curious', o: 'look', p: {qab: 1, qar: .9, qbr: .1, qr1: 1}, b: ['m', '高い利回りは、良い商品じゃない？'], t: `答え：高い利回りは商品の出来の良さではなく、返してもらえない危険を引き受けることへの見返りです。`},
  {f: 'ask', o: 'chin', p: {qab: 1, qar: .9, qbr: .1, qr1: 1}, b: ['m', 'とびぬけて高いのは、なぜ？'], t: `市場でとびぬけて高い利回りを示している債券を見たときは、その背景にある市場の仕組みを考えます。`},
  {f: 'wry', o: 'hold', p: {qab: 1, qar: .9, qbr: .1, qr1: 1, qb1: 1, qhB: 1}, b: ['q', '「利回りが高いから得な商品だ」'], t: `「利回りが高いから得な商品だ」と飛びつくのではなく、原因と結果の順番を逆から見る必要があります。知人Bさんが「年1%の利息を払うから100万円を貸してほしい」と頼んでも、誰も貸そうとはしません。`},
  {f: 'search', o: 'lean', p: {qab: 1, qar: .9, qbr: .1, qr1: 1, qr10: 1, qhB: 1}, b: ['q', '「年10%」'], t: `そこでBさんは危険を承知で貸してくれる人を探すために、「毎年10万円（年10%）の利息を払うから貸してほしい」と、大きく上乗せした条件を示すしかなくなります。その結果、市場に年10%という高い利回りの債券が出てきます。`},
  {f: 'serious', o: 'hold', p: {qab: 1, qar: .9, qbr: .1, qr1: 1, qr10: 1, qfee: 1, qhB: 1}, b: ['q', '「危険料」'], t: `高い利回りは商品の優れた性能ではなく、貸したお金が返ってこない危険を引き受ける対価、いわば「危険料」です。`},
  {f: 'sure', o: 'point', p: {qab: 1, qar: .9, qbr: .1, qr1: 1, qr10: 1, qfee: 1, qx: 1}, b: ['q', '「利回りを高くするしかない」'], t: `「利回りが高いから良い商品」なのではなく、「誰も貸したがらないほど返せなくなる危険が高いから、利回りを高くするしかない」というのが金融の仕組みです。`},
 ]},
 {ch: '5節', ttl: '5. 発行体の種類と危険のありか', sd: 0, steps: [
  {f: 'curious', o: 'look', p: {qis: 1, qp1: 1, qp2: 1, qp3: 1}, b: ['m', '国、自治体、会社'], t: `答え：債券は国が出す国債、自治体が出す地方債、会社が出す社債に分かれ、信用力の高い順に利回りは低くなります。`},
  {f: 'listen', o: 'look', p: {qis: 1, qp1: 1, qp2: 1, qp3: 1}, b: ['m', '3つに分かれるんだ'], t: `債券はそれを発行してお金を集める発行体の性格によって、大きく3つに分けられます。`},
  {f: 'read', o: 'look', p: {qis: 1, qp1: 1, qp2: .3, qp3: .3}, b: ['q', '「国債」'], t: `1つ目が「国債」です。国が発行する債券で、国が税を集める権利などで支えられています。日本国内の取引では最も信用力が高く、ほかの金利の基準として扱われます。`},
  {f: 'read', o: 'lean', p: {qis: 1, qp1: .3, qp2: 1, qp3: .3}, b: ['q', '「地方債」'], t: `2つ目が「地方債」です。東京都や大阪市のような地方自治体が発行する債券で、学校や道路などの整備に使うお金として集められます。自治体の財政の大きさや国の制度による関わりで安全性は高く保たれていますが、発行の条件は自治体ごとに決められます。`},
  {f: 'serious', o: 'chin', p: {qis: 1, qp1: .3, qp2: .3, qp3: 1}, b: ['q', '「社債」'], t: `3つ目が「社債」です。民間の会社が事業に使うお金を集めるために発行する債券です。会社の事業の状況や稼ぐ力に強く左右されるので、業績が悪くなれば利息や元本の支払いが止まる危険を直接抱えています。`},
  {f: 'know', o: 'chest', p: {qis: 1, qp1: 1, qp2: 1, qp3: 1, qord: 1}, b: ['m', '信用力の差が、金利の差'], t: `この3つの中で、一般に国債の利回りが最も低く、社債の利回りが高めになるのは、発行体の信用力の差がそのまま金利の差に表れているためです。地方債の利回りはその間に入ります。国より信用力が一段下がる分、国債より少し高くなり、民間の会社の社債よりは低いことが多くなります。`},
  {f: 'focus', o: 'lean', p: {qis: 1, qp1: 1, qp2: 1, qp3: 1, qyl: 1}, b: ['m', '国、市、会社の順に高い'], t: `実際の数字で並べた例があります。2012年7月ごろに発行された5年ものの債券で、復興国債が年0.19%、川崎市の市債が年0.22%、東北電力の個人向け社債が年0.72%でした（出典6）。`},
  {f: 'scrut', o: 'hold', p: {qis: 1, qp1: 1, qp2: 1, qp3: 1, qyl: 1, qold: 1}, b: ['q', '「いまの水準はこの数字とは違います」'], t: `期間が同じ5年でも、国、自治体、会社の順に利回りが高くなっています。ただし、これは当時の一例です。いまの水準はこの数字とは違います。`},
 ]},
 {ch: '6節', ttl: '6. 元本が返ってくるための3つの前提', sd: 1, zf: .5, steps: [
  {f: 'curious', o: 'look', p: {qgt: 1}, b: ['m', '前提が3つ？'], t: `答え：「元本が返ってくる」には、満期まで持つこと、発行体が満期まで払える状態でいること、債券の通貨で数えること、の3つの前提があります。`},
  {f: 'ask', o: 'chin', p: {qgt: 1}, b: ['q', '「元本が返ってくる」'], t: `債券について言われる「元本が返ってくる」という言い方には、見落とされやすい3つの前提があります。`},
  {f: 'sober', o: 'hold', p: {qgt: 1, qk1: 1}, pl: {qrd: 1}, b: ['q', '「満期日まで持ち続けること」'], t: `1つ目の前提は「満期日まで持ち続けること」です。急な病気や出費で途中で売った場合、そのときの相場によっては元本を大きく下回る金額でしか売れないことがあります。2節の例のとおり、金利が上がった3年目に売れば、戻るのは97万円です。`},
  {f: 'serious', o: 'hold', p: {qgt: 1, qk1: .5, qk2: 1}, pl: {qrd: 2}, b: ['q', '「満期まで発行体が続き、払える状態でいること」'], t: `2つ目の前提は「満期まで発行体が続き、払える状態でいること」です。どれほど安定して見える大きな会社でも、倒産すれば、借用書の約束にかかわらず元本が全額は戻らないことが起きます。`},
  {f: 'uneasy', o: 'chin', p: {qgt: 1, qk1: .5, qk2: 1, qk2d: 1}, pl: {qrd: 2}, b: ['m', '30万円しか戻らないことも'], t: `たとえば倒産の後に残った財産を分けた結果、100万円のうち30万円しか戻らない、ということもあります（説明のための例。戻る額は会社ごとに違い、0円のこともあります）。`},
  {f: 'curious', o: 'look', p: {qgt: 1, qk1: .5, qk2: .5, qk3: 1}, pl: {qrd: 3}, b: ['q', '「その債券が発行された通貨で数えて」'], t: `3つ目の前提は「その債券が発行された通貨で数えて元本が戻ること」です。`},
  {f: 'search', o: 'lean', p: {qgt: 1, qk1: .5, qk2: .5, qk3: 1, qfx: 1}, pl: {qrd: 3}, b: ['m', 'ドルは戻っても、円では減る'], t: `たとえば米ドルで発行された債券を買い、約束どおり満期に1万ドルが戻ってきても、為替が1ドル150円から120円へと円高に動いていれば、円で数えた元本は150万円から120万円に目減りします。`},
  {f: 'read', o: 'look', p: {qgt: 1, qk1: .5, qk2: .5, qk3: 1, qfx: 1}, pl: {qrd: 3}, b: ['q', '「円高」'], t: `為替は、円とドルのように異なる通貨を交換するときの値段で、円高は、円の価値がほかの通貨に比べて上がることです。`},
  {f: 'resolve', o: 'point', p: {qgt: 1, qk1: 1, qk2: 1, qk3: 1}, pl: {qrd: 4}, b: ['q', '「元本が必ず返ってくる高利回りの債券」'], t: `金融の商品の勧誘で「元本が必ず返ってくる高利回りの債券」という言葉を聞いたときは、満期まで持てるか、相手は破綻しないか、為替で目減りしないか、の3つを照らし合わせます。`},
 ]},
 {ch: '7節', ttl: '7. 約束の範囲を押さえる', sd: 0, steps: [

  {f: 'sure', o: 'hold', p: {qsm: 1, qs1: 1, qs2: 1}, b: ['q', '「利回りの高さは信用力の裏返し」'], t: `利回りの高さは信用力の裏返しで、`},

  {f: 'open', o: 'point', p: {qsm: 1, qs1: 1, qs2: 1, qs3: 1, qnx: 1}, b: ['q', '「投資信託」'], t: `株式と債券という2つの基本の道具の違いを押さえたうえで、次の章では、これらを組み合わせてまとめて運用する「投資信託」の仕組みに進みます。`},
 ]},

 ]},

  el.style.display = 'block'; el.style.left = z.x + 'px'; el.style.top = z.y + 'px'; el.style.width = z.w + 'px'; el.style.maxHeight = z.h + 'px'; }
function show(instant) {
  const b = B[bi], s = b.steps[st];
  Object.assign(T, DEF, FACE[s.f] || {}, POSE[s.o] || {}, s.p || {}, LAND ? s.pl || {} : plPort(s));
  const kq = (KS[bi] || [])[st] || ['watch', 'rest', null];
  Object.assign(T, KFACE[kq[0]] || {}, kq[1] === 'point' && !LAND ? {kpx: 1.5, kpy: -3.3} : KPOSE[kq[1]] || {});   /* スマホの「指す」は上の絵を指す */
  const tn = TINT[bi] || TINT[0]; T.cam = (CAMS[bi] || [])[st] || 0; T.bzl = BZL[bi] || 0; T.tr = tn[0]; T.tg = tn[1]; T.tb = tn[2];
  T.sd = b.sd || 0; if (s.cf) Object.assign(CFT, s.cf); TLM = s.tm || (LAND && s.tml) || '';
  { const gs = Object.assign({}, b.g || {}, s.g || {}), zz = gs.z || (b.sd ? [.02, 0, .44, 1] : [.54, 0, .44, 1]);
    T.zx0 = zz[0]; T.zy0 = zz[1]; T.zw0 = zz[2]; T.zh0 = zz[3];
    const zc = zz[0] + zz[2] / 2, pos = (v, d) => !v ? d : v.z ? [zz[0] + zz[2] * v.x, zz[1] + zz[3] * v.y, v.s, v.f] : v;
    const pin = gs.p && gs.p.z; T.pgin = pin ? 1 : 0; if (pin) { T.pbx = gs.p.x; T.pby = gs.p.y; T.zx0 = .16; T.zw0 = .82; }   /* {z:1,…} は絵の枠の中の位置 */
    const pp = pos(gs.p, [b.sd ? .69 : .31, 1.2, 1.05]), kk = pos(gs.k, [b.sd ? .92 : .08, 1.05, 1]);
    T.pgx = pp[0]; T.pgy = pp[1]; T.pgs = pp[2]; T.pgf = pp[3] || (pp[0] < zc ? 1 : -1);
    T.kbx = kk[0]; T.kby = kk[1]; T.kbs = kk[2]; T.kbf = kk[3] || (kk[0] < zc ? 1 : -1); BUP = !!gs.bu; BLIM = gs.bl || 0; }
  if (s.scr) SCRK = s.scr;
  $('#ch').textContent = b.ch; $('#tt').textContent = b.ttl;
  const cap = $('#cap'); cap.className = 'cap' + (s.mine ? ' mine' : ''); cap.innerHTML = capHTML(s);
  const all = B.reduce((a, x) => a + x.steps.length, 0), done = B.slice(0, bi).reduce((a, x) => a + x.steps.length, 0) + st + 1;
  $('#pg').textContent = '場面 ' + (bi + 1) + '/' + B.length + ' ・ ' + done + '/' + all;
  target();
  if (instant) { OBS.t = []; OBS.p = []; Object.assign(P, T); Lc.top = Lt.top; Lc.bot = Lt.bot; stepT0 = -1e9; } else stepT0 = NOW;
  layout(); geom(); buildLabs(s); placeSrc(); placeLabs();
  deck.step = st;
  markNav();
}

/* ───────── 節ごとの移動（下の点と目次） ───────── */
const SECS = []; B.forEach((b, i) => { if (!SECS.length || SECS[SECS.length - 1].ch !== b.ch) SECS.push({ch: b.ch, ttl: b.ttl, first: i, last: i}); else SECS[SECS.length - 1].last = i; });
const secOf = i => SECS.findIndex(x => i >= x.first && i <= x.last);
const dotLabel = x => { const m = x.ch.match(/^(\d+)節$/); return m ? m[1] : x.ch === 'F 金融 ／ L1 基礎' ? '始' : x.ch.slice(0, 1); };
const tocName = x => x.ch === 'F 金融 ／ L1 基礎' ? 'はじめに' : x.ttl.replace(/^\d+\.\s*/, '');
function buildNav() {
  $('#dots').innerHTML = SECS.map((x, i) => '<button data-s="' + i + '" title="' + esc(tocName(x)) + '" aria-label="' + esc(tocName(x)) + '">' + esc(dotLabel(x)) + '</button>').join('');
  $('#tocl').innerHTML = SECS.map((x, i) => '<li><button data-s="' + i + '"><span class="no">' + esc(dotLabel(x)) + '</span>' + esc(tocName(x)) + '</button></li>').join('');
  for (const el of document.querySelectorAll('#dots button,#tocl button')) el.onclick = e => { e.stopPropagation(); $('#tocp').classList.remove('open'); go(SECS[+el.dataset.s].first, false, 0); };
  $('#toc').onclick = e => { e.stopPropagation(); $('#tocp').classList.toggle('open'); };
  addEventListener('click', e => { if (!$('#tocp').contains(e.target)) $('#tocp').classList.remove('open'); });
}
function markNav() {
  const k = secOf(bi);
  document.querySelectorAll('#dots button').forEach((el, i) => { el.className = i === k ? 'on' : i < k ? 'done' : ''; });
  document.querySelectorAll('#tocl button').forEach((el, i) => { el.className = i === k ? 'on' : ''; });
  document.body.classList.toggle('cover', bi === 0);
}
function go(n, instant, s) { bi = clamp(n | 0, 0, B.length - 1); st = clamp((s || 0) | 0, 0, B[bi].steps.length - 1); show(instant); }
function next() { if (st < B[bi].steps.length - 1) { st++; show(false); } else if (bi < B.length - 1) { bi++; st = 0; show(false); } }
function back() { if (st > 0) { st--; show(false); } else if (bi > 0) { bi--; st = B[bi].steps.length - 1; show(false); } }
window.go = go; window.cur = () => bi;

let last = 0, fT = 0, fN = 0;
function frame(ms) {
  const t = ms / 1000, dt = clamp(t - last, 0, .05), k = 1 - Math.exp(-dt * 4.2); last = t; NOW = t;
  for (const key in DEF) P[key] += (T[key] - P[key]) * k;
  Lc.top += (Lt.top - Lc.top) * k; Lc.bot += (Lt.bot - Lc.bot) * k;
  layout(); geom();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  OBS.t = []; OBS.p = []; safe('背景', () => backdrop(t)); REC = true; if (LAND) safe('床', floorLine);
  if (window.__collect) { window.__txt = []; window.__cards = []; }
  const Zs = Z; if (LAND) { Z = {x: 0, y: 0, w: BW, h: BH}; BMODE = true; g.save(); g.translate(BOARD.x, BOARD.y); g.scale(BOARD.k, BOARD.k); }
  safe('下地', () => under(t)); safe('表紙の絵', () => coverArt(t)); safe('借用書', () => cert(t)); safe('年表', () => timeline(t)); safe('カフェ', () => cafe(t)); if (!LAND) safe('カフェの立場', cafeNamesP); safe('比べる表', () => cmpTable(t)); safe('値札', () => tags(t)); safe('AとB', () => ab(t));
  safe('柱', () => issuers(t)); safe('前提', () => gates(t)); safe('まとめ', () => summary(t)); safe('ノート', () => noteSheet(t));
  if (LAND) { g.restore(); Z = Zs; BMODE = false; }
  REC = false; safe('ペンギン', () => person(t)); safe('シロクマ', () => bear(t)); safe('手前', fore);
  try { placeLabs(); } catch (e) { note('札: ' + e.message); }
  deck.frames++;
  fN++; if (t - fT > 1) { $('#fps').textContent = VERSION + '｜場面' + (bi + 1) + '-' + (st + 1) + '｜毎秒' + fN + 'コマ' + (errs.length ? '｜絵の失敗 ' + errs.length + ' 件' : ''); fN = 0; fT = t; }
}
function tick(ms) { if (innerWidth !== VW0 || innerHeight !== VH0) resize();   /* pcfit v1.1: 画面の大きさが、並べたときと違っていたら並べ直す */ frame(ms); requestAnimationFrame(tick); }
window.__frame = () => frame(performance.now());
let FIT = 1, FX = 0, FY = 0, VW0 = 0, VH0 = 0;   /* pcfit v1.0: スマホの横向きで縮める倍率と、真ん中に置くためのずらし（1・0 は縮めない） */
const GBCR = Element.prototype.getBoundingClientRect;
Element.prototype.getBoundingClientRect = function () { const r = GBCR.call(this); if (FIT === 1) return r;
  const x = (r.left - FX) / FIT, y = (r.top - FY) / FIT, w = r.width / FIT, h = r.height / FIT;
  return {x, y, left: x, top: y, width: w, height: h, right: x + w, bottom: y + h}; };
function resize() {
  const vw = innerWidth, vh = innerHeight, fit = vw >= vh && vh < 500; VW0 = vw; VH0 = vh;
  FIT = fit ? Math.min(vw / 1280, vh / 720) : 1; FX = fit ? Math.round((vw - 1280 * FIT) / 2) : 0; FY = fit ? Math.round((vh - 720 * FIT) / 2) : 0;
  const bs = document.body.style; document.body.classList.toggle('pcfit', fit);
  bs.width = fit ? '1280px' : ''; bs.height = fit ? '720px' : ''; bs.transform = fit ? 'translate(' + FX + 'px,' + FY + 'px) scale(' + FIT + ')' : '';
  W = fit ? 1280 : vw; H = fit ? 720 : vh; LAND = W >= H; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  measure(); show(true);
}
function fail(msg) { const f = $('#fail'); f.style.display = 'block'; f.textContent = 'この資料の絵が描けませんでした（' + msg + '）。外から読み込む部品は使っていないので、ブラウザを新しくするか、別のブラウザで開き直してください。本文は下の白い帯で読めます。'; $('#fade').style.opacity = 0; }

$('#src').innerHTML = '<h3>出典（本文の末尾の表の6つ）</h3><ol>' + SRC.map(s => '<li>' + esc(s[0]) + '<div class="u">' + esc(s[1]) + '</div><div class="k">' + esc(s[2]) + '</div></li>').join('') + '</ol>';
$('#fps').textContent = VERSION;
if (location.search.includes('fps')) $('#fps').style.display = 'block';
$('#nx').onclick = next; $('#pv').onclick = back; buildNav();
addEventListener('keydown', e => { const onBtn = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if (e.key === 'ArrowRight' || ((e.key === ' ' || e.key === 'Enter') && !onBtn)) { e.preventDefault(); next(); } if (e.key === 'ArrowLeft') back(); if (e.key === 'Escape') $('#tocp').classList.remove('open'); });
let sx0 = null; addEventListener('touchstart', e => { sx0 = e.touches[0].clientX; }, {passive: true});
addEventListener('touchend', e => { if (sx0 === null) return; const dx = e.changedTouches[0].clientX - sx0; if (Math.abs(dx) > 60) dx < 0 ? next() : back(); sx0 = null; }, {passive: true});
if (!g) fail('このブラウザは絵を描く機能が使えません');
else {
  try {
    /* pcfit v1.0: シロクマの一言の数と段の数を、開いたときに確かめる（違えば資料の検査が不合格にする） */
B.forEach((b, i) => { const n = KS[i] ? KS[i].length : 0; if (n !== b.steps.length) console.error('シロクマの一言の数が段の数と合わない：場面' + (i + 1) + '（段 ' + b.steps.length + '・一言 ' + n + '）'); });
addEventListener('resize', resize);
    resize();
    const qs = new URLSearchParams(location.search);   /* 住所の末尾に ?b=場面&s=段 を付けると、その段から開く */
    if (qs.get('b')) go((+qs.get('b') || 1) - 1, true, (+qs.get('s') || 1) - 1);
    requestAnimationFrame(tick);
    setTimeout(() => { $('#fade').style.opacity = 0; }, 150);
  } catch (e) { fail(e.message); }
}

</script>
