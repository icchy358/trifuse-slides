const deck = window.__deck = {version: VERSION, beats: B.length, missing: 'check_text.py で数える', setErrors: errs, steps: B.map(b => b.steps.length), step: 0, frames: 0};

/* ───────── 節ごとの移動（下の点と目次） ───────── */
const SECS = []; B.forEach((b, i) => { if (!SECS.length || SECS[SECS.length - 1].ch !== b.ch) SECS.push({ch: b.ch, ttl: b.ttl, first: i, last: i}); else SECS[SECS.length - 1].last = i; });

function buildNav() {
  $('#dots').innerHTML = SECS.map((x, i) => '<button data-s="' + i + '" title="' + esc(tocName(x)) + '" aria-label="' + esc(tocName(x)) + '">' + esc(dotLabel(x)) + '</button>').join('');

function go(n, instant, s) { bi = clamp(n | 0, 0, B.length - 1); st = clamp((s || 0) | 0, 0, B[bi].steps.length - 1); show(instant); }

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  safe('背景', () => backdrop(t)); safe('建物', building); safe('ニュース', () => tvCrowd(t)); safe('人びと', () => crowd7(t)); safe('人影', () => shadow(t));
  safe('画面', () => phoneScreen(t)); safe('門', () => gate(t)); safe('ノート', () => sheet(t)); safe('外を通る話', () => envelopes(t)); safe('問い', () => questions(t));
  safe('線', () => checkLine(t)); safe('理由', badges); safe('気づき', () => lamp(t)); safe('ペンギン', () => person(t)); safe('親切な顔の話', friendCard); safe('覆い', () => cocoon(t)); safe('シロクマ', () => bear(t)); safe('手前', fore);
  try { placeLabs(); } catch (e) { note('札: ' + e.message); }
  deck.frames++;
  fN++; if (t - fT > 1) { $('#fps').textContent = VERSION + '｜場面' + (bi + 1) + '-' + (st + 1) + '｜毎秒' + fN + 'コマ' + (errs.length ? '｜絵の失敗 ' + errs.length + ' 件' : ''); fN = 0; fT = t; }

}
let FIT = 1, FX = 0, FY = 0;   /* pcfit v1.0: スマホの横向きで縮める倍率と、真ん中に置くためのずらし（1・0 は縮めない） */
